name: Backend CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, test, and validate container image
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: zentra_test
          MYSQL_ROOT_PASSWORD: Ajiang123,.
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pAjiang123,."
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7.4
        ports:
          - 6380:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install --yes mysql-client

      - name: Initialize integration-test database
        env:
          MYSQL_PWD: Ajiang123,.
        run: |
          mysql --protocol=TCP --host=127.0.0.1 --port=3307 --user=root \
            zentra_test < docker/mysql/init.sql

      - name: Run automated tests
        run: mvn --batch-mode --no-transfer-progress clean test

      - name: Package application
        run: mvn --batch-mode --no-transfer-progress package -DskipTests

      - name: Validate Docker image build
        run: docker build --tag zentra-server:ci-${{ github.sha }} .
