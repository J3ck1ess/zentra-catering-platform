name: Backend CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, test, and validate container image
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: zentra_test
          MYSQL_ROOT_PASSWORD: Ajiang123,.
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pAjiang123,."
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7.4
        ports:
          - 6380:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      kafka:
        image: apache/kafka:4.3.1
        ports:
          - 9094:9094
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller

          KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
          KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
          KAFKA_NUM_PARTITIONS: 3
        options: >-
          --health-cmd="/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=15s

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install --yes mysql-client

      - name: Initialize integration-test database
        env:
          MYSQL_PWD: Ajiang123,.
        run: |
          mysql --protocol=TCP --host=127.0.0.1 --port=3307 --user=root \
            zentra_test < docker/mysql/init.sql

      - name: Initialize Kafka topics
        run: |
          docker run --rm \
            --network host \
            apache/kafka:4.3.1 \
            /opt/kafka/bin/kafka-topics.sh \
            --create \
            --if-not-exists \
            --topic zentra.order.created \
            --bootstrap-server localhost:9094 \
            --partitions 3 \
            --replication-factor 1

      - name: Run automated tests
        run: mvn --batch-mode --no-transfer-progress clean test

      - name: Package application
        run: mvn --batch-mode --no-transfer-progress package -DskipTests

      - name: Validate Docker image build
        run: docker build --tag zentra-server:ci-${{ github.sha }} .
