services:

  mysql:
    image: mysql:8.4

    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

    container_name: zentra-mysql

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: Ajiang123,.
      MYSQL_DATABASE: zentra

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7.4

    container_name: zentra-redis

    restart: unless-stopped

    ports:
      - "6380:6379"

    volumes:
      - redis_data:/data

  zentra-server:
    image: zentra-server:1.0

    container_name: zentra-server

    restart: unless-stopped

    depends_on:
      - mysql
      - redis

    ports:
      - "8080:8080"

    environment:
      SPRING_PROFILES_ACTIVE: prod

volumes:
  mysql_data:
  redis_data: