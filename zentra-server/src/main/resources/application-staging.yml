# Staging profile configuration. Credentials are supplied only at runtime.
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://mysql:3306/zentra?useSSL=false&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      database: 0
      timeout: 3000ms
